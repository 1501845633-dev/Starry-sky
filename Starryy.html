<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cinematic Hand-Controlled Galaxy</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; cursor: none; }
        #hint {
            position: absolute; top: 30px; left: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 2px; text-transform: uppercase; font-size: 14px;
            border-left: 2px solid #ff9900; padding-left: 15px;
            pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="hint">System Online: Gesture Control Active<br>Pinch to Warp Speed</div>
    
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <video id="video" style="display:none;" autoplay playsinline></video>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

        // --- 初始化配置 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.autoClear = false; // ⭐ 关键这一行
        // 开启电影色调映射，让色彩更高级
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- 后期处理：更细腻的泛光 ---
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.2, 0.5, 0.1
        );
        composer.addPass(bloomPass);
        // 启用 layer 0（主世界）和 layer 1（文字）
        camera.layers.enable(0); // 主世界
        camera.layers.enable(1); // 文字层

        const parameters = {
            count: 60000,         // 平衡性能与视觉
            size: 0.04,
            radius: 10,
            branches: 5,
            spin: 1.2,
            randomness: 0.3,
            insideColor: '#ffbb33',
            outsideColor: '#2266ff'
        };

        // --- 纹理生成：让星星像真实的星光点 ---
        const createStarTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.4)');
            grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        };

        // --- 核心物体创建 ---
        let geometry, material, points, blackHoleGroup, accretionDisk, textSprite, clearTextSprite;

        const initGalaxy = () => {
            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(parameters.count * 3);
            const colors = new Float32Array(parameters.count * 3);
            const scales = new Float32Array(parameters.count); // 随机缩放让星系更有层次

            const colorInside = new THREE.Color(parameters.insideColor);
            const colorOutside = new THREE.Color(parameters.outsideColor);

            for (let i = 0; i < parameters.count; i++) {
                const i3 = i * 3;
                const r = Math.random() * parameters.radius;
                const spinAngle = r * parameters.spin;
                const branchAngle = (i % parameters.branches) / parameters.branches * Math.PI * 2;

                // 使用指数函数让中心更密集
                const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r;
                const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r * 0.4;
                const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r;

                positions[i3] = Math.cos(branchAngle + spinAngle) * r + randomX;
                positions[i3+1] = randomY;
                positions[i3+2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

                const mixedColor = colorInside.clone().lerp(colorOutside, r / parameters.radius);

                // 映射到文字 mask 空间
                const tx = Math.floor(
                    ((positions[i3] / parameters.radius) * 0.5 + 0.5) * 512
                );
                const ty = Math.floor(
                    ((positions[i3 + 2] / parameters.radius) * 0.5 + 0.5) * 128
                );

                let isText = false;
                if (typeof textMask !== 'undefined' && tx >= 0 && tx < 512 && ty >= 0 && ty < 128) {
                    const idx = (ty * 512 + tx) * 4;
                    isText = textMask.data[idx] > 10;
                }

                if (isText) {
                    // ⭐ 关键三件事 ⭐
                    mixedColor.multiplyScalar(3.5);   // 比普通星尘亮很多
                    positions[i3 + 1] *= 0.2;         // 压扁到盘面
                } else {
                    mixedColor.multiplyScalar(3.0);
                }

                colors[i3] = mixedColor.r;
                colors[i3+1] = mixedColor.g;
                colors[i3+2] = mixedColor.b;

                scales[i] = Math.random();
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            material = new THREE.PointsMaterial({
                size: parameters.size,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                transparent: true,
                map: createStarTexture(),
                opacity: 0.8
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);

            // 黑洞装饰
            blackHoleGroup = new THREE.Group();
            const core = new THREE.Mesh(
                new THREE.SphereGeometry(0.4, 32, 32),
                new THREE.MeshBasicMaterial({ color: 0x000000 })
            );
            
            // 吸积盘使用更细腻的环
            const diskGeo = new THREE.TorusGeometry(1.2, 0.02, 16, 100);
            const diskMat = new THREE.MeshBasicMaterial({ 
                color: 0xffaa00, 
                transparent: true, 
                opacity: 0.4,
                blending: THREE.AdditiveBlending 
            });
            accretionDisk = new THREE.Mesh(diskGeo, diskMat);
            accretionDisk.rotation.x = Math.PI / 2;
            
            blackHoleGroup.add(core);
            blackHoleGroup.add(accretionDisk);
            scene.add(blackHoleGroup);
        };

        const textMask = createTextMask();
        initGalaxy();

        // --- Nebula text sprite (置于黑洞之后方一点) ---
        textSprite = new THREE.Sprite(
            new THREE.SpriteMaterial({
                map: createNebulaTextTexture(),
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            })
        );
        textSprite.position.set(0, 0, -2);
        textSprite.scale.set(12, 3, 1);
        scene.add(textSprite);

        // 清晰文字，只在捏合时显示，放在 layer 1（不受 Bloom 影响）
        clearTextSprite = new THREE.Sprite(
            new THREE.SpriteMaterial({
                map: createClearTextTexture(),
                transparent: true,
                opacity: 0,
                depthWrite: false
            })
        );
        clearTextSprite.scale.set(10, 2.5, 1);
        clearTextSprite.position.set(0, 0.8, -1.5);
        clearTextSprite.layers.set(1);
        scene.add(clearTextSprite);
        camera.position.set(0, 8, 15);
        camera.lookAt(0, 0, 0);

        // --- 漂浮文字标签 ---
        // --- 修正后的漂浮文字标签函数 ---
        function createTextMask() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0,0,512,128);
            ctx.font = 'bold 64px serif'; // 一定要 bold
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // text removed per user request (no visible phrase)
            ctx.fillStyle = 'white';
            // ctx.fillText('Tu Me Manques', 256, 64);

            return ctx.getImageData(0, 0, 512, 128);
        }
        
        function createNebulaTextTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景透明
            ctx.globalCompositeOperation = 'source-over';

            // 模糊文字
            ctx.font = 'bold 96px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.shadowColor = 'rgba(180, 200, 255, 0.6)';
            ctx.shadowBlur = 40;

            ctx.fillStyle = 'rgba(200, 220, 255, 0.8)';
            // nebula text removed per user request
            // ctx.fillText('Tu Me Manques', 512, 128);

            return new THREE.CanvasTexture(canvas);
        }

        function createClearTextTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.font = 'bold 96px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // ⚠️ 不要 shadow，不要 bloom
            ctx.fillStyle = 'rgba(255, 210, 180, 1)';
            // clear text removed per user request
            // ctx.fillText('Tu Me Manques', 512, 128);

            return new THREE.CanvasTexture(canvas);
        }
        const addFloatingText = (scene, text) => {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // 关键点 1: 确保 Canvas 背景完全透明
            ctx.clearRect(0, 0, canvas.width, canvas.height); 

            // 设置文字样式
            ctx.font = 'italic 60px "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle'; // 垂直居中
            
            // 设置文字发光效果
            ctx.shadowColor = 'rgba(255, 200, 100, 0.9)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = 'white';
            
            // 在画布中心绘制文字
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            // 关键点 2: 显式开启透明支持
            const material = new THREE.SpriteMaterial({ 
                map: texture,
                transparent: true,      // 必须开启透明
                depthWrite: false,      // 防止透明物体遮挡后面的粒子
                opacity: 0.8, 
                blending: THREE.AdditiveBlending // 这种模式会让黑色背景彻底消失
            });

            const sprite = new THREE.Sprite(material);
            // 稍微调整位置和比例
            sprite.position.set(6, 1, -2); 
            sprite.scale.set(8, 2, 1);
            
            scene.add(sprite);
            return sprite;
        };

        // 在初始化处调用
        const floatingMessage = addFloatingText(scene, "Per Aspera ad Astra");

        // --- 手势交互 (优化平滑度) ---
        const videoElement = document.getElementById('video');
        let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
        let isHandPresent = false, isPinching = false;

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7 });
        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandPresent = true;
                const lm = results.multiHandLandmarks[0];
                // 捏合判定更灵敏
                isPinching = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y) < 0.06;
                targetX = (lm[8].x - 0.5) * 2;
                targetY = -(lm[8].y - 0.5) * 2;
            } else {
                isHandPresent = false;
                isPinching = false;
            }
        });

        const cam = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 480
        });
        cam.start();

        // --- 动画引擎 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // 1. 吸积盘微妙的起伏感
            if(accretionDisk) {
                accretionDisk.rotation.z += 0.02;
                accretionDisk.scale.setScalar(1 + Math.sin(elapsedTime * 2) * 0.05);
            }

            // 2. 交互平滑处理 (Lerp)
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;

            if (isHandPresent) {
                points.rotation.x += (currentY * 0.8 - points.rotation.x) * 0.05;
                points.rotation.y += (currentX * 0.8 - points.rotation.y) * 0.05;
                
                // 捏合时的时空扭曲效果
                if (isPinching) {
                    points.rotation.y += 0.06;
                    material.size += (parameters.size * 2.5 - material.size) * 0.1;
                    bloomPass.strength += (2.5 - bloomPass.strength) * 0.1;
                } else {
                    material.size += (parameters.size - material.size) * 0.1;
                    bloomPass.strength += (1.2 - bloomPass.strength) * 0.1;
                }
            } else {
                // 闲置时的优雅旋转
                points.rotation.y += 0.003;
                points.rotation.z += 0.001;
            }

            // 3. 让黑洞组产生微弱的引力抖动
            blackHoleGroup.position.y = Math.sin(elapsedTime) * 0.1;

            // 4. 文字标签动画效果
            if (floatingMessage) {
                // 随时间产生 0.3 到 0.8 之间的透明度变化
                floatingMessage.material.opacity = 0.5 + Math.sin(Date.now() * 0.001) * 0.2;
                
                // 如果想要文字随手势飘动，可以加上这行
                floatingMessage.position.y += Math.sin(Date.now() * 0.0005) * 0.002;
            }

            // Nebula text 呼吸效果，让它更像宇宙的一部分
            if (textSprite && textSprite.material) {
                textSprite.material.opacity = 0.22 + Math.sin(performance.now() * 0.0005) * 0.05;
            }

            // 清晰文字（只在捏合时显现）
            if (clearTextSprite && clearTextSprite.material) {
                if (isPinching) {
                    clearTextSprite.material.opacity += (1.0 - clearTextSprite.material.opacity) * 0.1;
                    clearTextSprite.position.y += Math.sin(performance.now() * 0.002) * 0.001;
                } else {
                    clearTextSprite.material.opacity += (0.0 - clearTextSprite.material.opacity) * 0.1;
                }
            }

            // 1️⃣ 清一次（只清最开始）
            renderer.clear();

            // 2️⃣ 主世界 + Bloom
            camera.layers.set(0);
            composer.render();

            // 3️⃣ 文字层（不进 Bloom）
            renderer.clearDepth();
            camera.layers.set(1);
            renderer.render(scene, camera);
        }

        animate();

        // 响应窗口缩放
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
